const genres=[
{name:'Fantasy',tag:'De kracht van het onmogelijke',world:'Magie & verbeelding',core:'Een verhaalwereld waarin magie of het bovennatuurlijke werkelijk bestaat en een betekenisvolle rol speelt.',features:['Magie en bovennatuurlijke krachten','Verzonnen wezens of een imaginaire wereld','Vaak queesten, archetypen en een strijd tussen goed en kwaad'],themes:'Moed, macht, identiteit, lotsbestemming en de verantwoordelijkheid van een held.',words:'magie · bovennatuurlijk · imaginair · mythisch · archetype · queeste',nuance:'Een mythisch verleden, een aparte wereld of een queeste komt vaak voor, maar is geen verplichting. Ook een verhaal in een hedendaagse stad kan fantasy zijn.',sample:'Toen Mira de ware naam van de poort fluisterde, ontwaakte het steen. Alleen een erfgenaam van de verdwenen tovenaars kon de doorgang openen.'},

{title:'Een gevangene in Adarlan',book:'De glazen troon',author:'Sarah J. Maas',pages:'4–6',context:'Celaena wordt na een jaar dwangarbeid uit de zoutmijnen gehaald. Het fragment uit de lesbundel verbindt haar gevangenschap met een magische verhaalwereld.',text:[
'Na een jaar van dwangarbeid in de zoutmijnen van Endovier was Celaena Sardothien eraan gewend dat ze overal in ketenen en onder dreiging van een zwaard naartoe werd begeleid door duistere demonen. De meesten van de duizenden slaven in Endovier werden zo behandeld; hoewel er bij Celaena altijd nog eens zes extra wachters van en naar de mijnen meeliepen. Dat verwachtte de beruchtste sluipmoordenaar van Adarlan inmiddels wel. Maar vandaag was er ook een magiër in een zwarte mantel met kap bij. Er werd gefluisterd dat hij een verschrikkelijke vloek had uitgesproken over Endovier. Hij leidde haar aan de arm door het mooie gebouw waarin de ambtenaren en opzichters van Endovier waren ondergebracht.',
'[…] Ze gingen een heel lange gang in, waar in de stilte alleen hun voetstappen klonken. Hoewel de man die haar arm vasthield lang en fit was, zag ze door de kap die hij droeg niets van zijn gezicht. Ook alweer een tactiek om haar te verwarren en te intimideren. Die zwarte kleding was daar waarschijnlijk ook voor bedoeld. Zijn hoofd draaide naar haar toe, en Celaena grijnsde naar hem.',
'[…] Ze had al een tijdje geen angst meer gevoeld; dat had ze zichzelf niet toegestaan. Elke morgen als ze wakker werd, herhaalde ze dezelfde woorden: ik zal niet bang zijn. Een jaar lang hadden die woorden het verschil gemaakt tussen buigen en breken, ervoor gezorgd dat ze niet was bezweken in de duisternis van de mijnen.'

{title:'Tweeduizend jaar later',book:'Infinity: de eindbestemming',author:'Guido Eekhaut',pages:'7–8',context:'Britt heeft haar opleiding aan een interplanetaire academie afgerond. Zij is onderweg naar haar eerste opdracht als diplomaat.',text:[
'Die andere studenten waren heel divers, in leeftijd, herkomst en soort. De Diplomatieke Academie van de Interplanetaire Raad trekt onderzoekers, studenten en specialisten aan uit allerlei culturen en beschavingen, en voor al deze zo ver uiteenlopende levensvormen worden speciale faciliteiten voorzien. Niet iedereen ademt zuurstof of overleeft zonder voortdurend ondergedompeld te zijn in een of andere vloeistof. Niet iedereen spreekt Amanglic (al zijn er genoeg vertaalmachines voorhanden), en niet iedereen voelt zich veilig onder de 0,9 g zwaartekracht van de planeet. Niet iedereen eet hetzelfde voedsel of drinkt op water gebaseerde drank.',

{title:'Een brief buiten de tijd',book:'De komst van Joachim Stiller',author:'Hubert Lampo',pages:'10–11',context:'Groenevelt ontvangt een brief over een krantenbijdrage die hij heeft geschreven. Vervolgens onderzoekt hij de envelop.',text:[
'Terwijl ik in een broodje hapte, wreef ik met de vrije hand de vouwen uit de brief, waarop geen datum voorkwam, wat mij enigszins verbaasde en waarin ik zakelijk als ‘Zeer geachte Heer Groenevelt’ werd aangesproken. Het was een vrij korte boodschap, die luidde als volgt: ‘In het dagblad ‘De Scheldebode’ zult gij op 14 juli 1957 een bijdrage laten verschijnen over reparatiewerken, aan de wegbedekking in de Kloosterstraat uitgevoerd. Wanneer gij deze brief ontvangt, is die bijdrage reeds verschenen. Ofschoon gij mijn belangstelling voor deze zaak vreemd zult vinden of althans buiten iedere verhouding, dank ik u voor de aan deze schijnbaar onbelangrijke gebeurtenis verleende aandacht.’',
'[…] Op het ogenblik, dat ik mij ervan bewust werd niet meer over de brief te piekeren – en toen was het natuurlijk te laat – schoot het mij te binnen, dat ik de enveloppe in de papiermand had gegooid. Het kostte mij geen moeite om de verfrommelde omslag weer te vinden. Ik streek hem zorgvuldig glad op de vensterbank. Beteuterd staarde ik naar de postzegel. Het was een exemplaar dat ik mij vaag uit mijn prilste kindertijd herinnerde, op zijn minst dertig jaar niet meer geldig, nog met het populaire oorlogsportret van koning Albert met trenchcoat en helm op.',
'[…] Ik las onthutst: II.IX.19. Wat logischerwijze betekende – voor zover het geval op enige logica aanspraak maken kon – dat de brief ruim anderhalf jaar voor mijn geboorte gepost zou zijn.'

function head(n,title,desc){return `<div class="eyebrow">Hoofdstuk ${String(n).padStart(2,'0')} / 07</div><h1 style="font-size:clamp(36px,4vw,54px)">${title}</h1><p class="section-intro">${desc}</p>`}
function quiz(id,index,exit=false){const q=Q[id],a=state.answers[id];return `<section class="question" id="q-${id}" aria-labelledby="title-${id}"><span class="qnum">${exit?'Exit ticket':q.group} · ${index+1}</span><h3 id="title-${id}">${esc(q.prompt)}</h3><div class="options" role="radiogroup" aria-labelledby="title-${id}">${q.options.map((s,i)=>`<label class="option"><input type="radio" name="${id}" value="${i}" ${a===i?'checked':''} ${exit&&state.exitSubmitted?'disabled':''}><span>${esc(s)}</span></label>`).join('')}</div>${!exit?`<div class="quiz-footer"><button class="button small" data-check="${id}">Controleer</button><small>Een hint helpt je verder.</small></div>`:''}<div class="feedback" id="fb-${id}" aria-live="polite" hidden></div></section>`}
function dropdown(id,index){const q=Q[id];const order=[3,6,0,7,4,2,5,1];return `<div class="row" id="q-${id}"><label for="select-${id}"><span class="subtle">${index+1}.</span> ${esc(q.prompt)}</label><div><select id="select-${id}" data-answer="${id}"><option value="">Kies een begrip…</option>${order.map(i=>`<option value="${i}" ${state.answers[id]===i?'selected':''}>${esc(q.options[i])}</option>`).join('')}</select><div id="fb-${id}" class="feedback" aria-live="polite" hidden></div></div></div>`}
function reflection(id,label,placeholder='Schrijf je antwoord en verwijs naar een concreet detail.'){return `<label for="reflection-${id}">${esc(label)}</label><textarea id="reflection-${id}" data-reflection="${id}" placeholder="${esc(placeholder)}">${esc(state.reflections[id]||'')}</textarea><div class="saved-note" id="saved-${id}">${state.reflections[id]?'Antwoord bewaard in deze browser.':''}</div>`}
function footer(){const i=routes.findIndex(x=>x[0]===current);return `<div class="footer-nav">${i?`<button class="button secondary" data-go="${routes[i-1][0]}">← Vorige</button>`:'<span></span>'}${i<6?`<button class="button" data-go="${routes[i+1][0]}">${i===0?'Ontdek de genre-atlas':'Volgende stap'} →</button>`:'<button class="button secondary" data-go="atlas">Terug naar de atlas</button>'}</div><p class="footnote">Tussen werelden · Je voortgang blijft ${storageOK?'opgeslagen in deze browser':'alleen tijdens deze sessie bewaard'}. Geen account, geen verzending. <button class="button secondary small" data-action="reset">Opnieuw beginnen</button></p>`}
function startPage(){return `<div class="hero"><div><div class="eyebrow">Vier werelden. Eén nieuwsgierige lezer.</div><h1>Waar eindigt<br>de werkelijkheid?</h1><p>Ontdek hoe verhalen hun eigen wetten maken. Leer fantasy, sciencefiction, magisch realisme en dystopie herkennen — en bewijs waarom jouw lezing klopt.</p><button class="button" data-go="atlas">Verken de atlas <span>↗</span></button><div class="intro-stat"><span><b>04</b> genrewerelden</span><span><b>07</b> tussenstops</span><span><b>± 100</b> minuten</span></div></div><div class="hero-art-wrap">${art(0,true)}<div class="art-caption">Een deur naar het onmogelijke</div></div></div><div class="section-top"><h2>Kies een wereld om te verkennen</h2><small>Elke wereld heeft eigen regels.</small></div><div class="worlds">${genres.map((g,i)=>`<button class="world" data-world="${i}">${art(i)}<div class="world-body"><small>WERELD 0${i+1}</small><h3>${g.name}</h3><p>${g.world}</p></div></button>`).join('')}</div><div class="section-top"><h2>Eerst: vertrouw op je leesintuïtie</h2><small>Voorkennis · zonder eindscore</small></div><p class="section-intro">Wat vermoed je bij deze vier tekstflitsen? Controleer je keuze. Je hoeft de theorie nog niet te kennen.</p>${intro.map((x,i)=>quiz(x,i)).join('')}<div class="panel">${reflection('zeker','Hoe zeker ben je van je keuzes? Welk onderscheid wil je beter begrijpen?','Bijvoorbeeld: ik twijfel tussen fantasy en magisch realisme…')}</div>`}
function atlasPage(){const g=genres[state.atlas];return head(2,'De genre-atlas','Leer de kern herkennen. Een genre is een patroon van aanwijzingen, geen afvinklijst die in elk fragment volledig aanwezig moet zijn.')+`<div class="tabs" aria-label="Kies een genre">${genres.map((g,i)=>`<button class="tab ${state.atlas===i?'active':''}" data-atlas="${i}" aria-pressed="${state.atlas===i}">${g.name}</button>`).join('')}</div><section class="paper"><div class="cols"><div><div class="eyebrow">${g.tag}</div><h2>${g.name}</h2><p>${g.core}</p></div><div style="max-width:230px;justify-self:center;width:100%;border-radius:80px 80px 10px 10px;overflow:hidden">${art(state.atlas)}</div></div><div class="fact-grid"><div class="fact"><strong>Typische aanwijzingen</strong><ul>${g.features.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="fact"><strong>Thema’s om over na te denken</strong><p>${g.themes}</p><strong>Woorden die je helpen</strong><p>${g.words}</p></div></div><div class="callout"><strong>Let op de nuance.</strong> ${g.nuance}</div><div class="eyebrow">Nieuw oefenfragment</div><blockquote class="sample">${g.sample}</blockquote></section><section class="paper"><h2>Het genrekompas</h2><p>Stel bij een onbekend fragment vier vragen. De antwoorden kunnen naar meer dan één genre wijzen.</p><div class="table-scroll"><table><thead><tr><th>Onderzoek</th><th>Vraag aan de tekst</th></tr></thead><tbody><tr><td>De verhaalwereld</td><td>Wat is herkenbaar? Wat wijkt af van onze werkelijkheid?</td></tr><tr><td>De verklaring</td><td>Is de afwijking magie, technologie of een onverklaard onderdeel van het gewone leven?</td></tr><tr><td>De samenleving</td><td>Welke macht of orde beïnvloedt het leven en de vrijheid van mensen?</td></tr><tr><td>Het bewijs</td><td>Welk concreet detail ondersteunt mijn keuze? Is er ook een andere lezing mogelijk?</td></tr></tbody></table></div><details><summary>Vergelijk de vier werelden naast elkaar</summary><div class="table-scroll"><table><thead><tr><th>Genre</th><th>Doorslaggevend patroon</th><th>Onvoldoende op zichzelf</th></tr></thead><tbody><tr><td>Fantasy</td><td>Magie of het bovennatuurlijke werkt werkelijk.</td><td>Een zwaard, een koning of een vreemde naam.</td></tr><tr><td>Sciencefiction</td><td>Wetenschappelijke of technologische veronderstellingen en hun gevolgen.</td><td>Een jaartal in de toekomst.</td></tr><tr><td>Magisch realisme</td><td>Het alledaagse is verweven met het onverklaarbare.</td><td>Een droom of een toevallig vreemd voorval.</td></tr><tr><td>Dystopie</td><td>Een onderdrukkende of ontwrichte maatschappelijke orde.</td><td>Een ramp, één verbod of één slechte bestuurder.</td></tr></tbody></table></div></details><button class="button" data-action="atlasDone">Ik heb de vier genres vergeleken ✓</button></section>`}
function wordsPage(){return head(3,'Het woordenatelier','Begrijp de woorden, herken ze in context en gebruik ze om nauwkeuriger over verhalen te spreken.')+`<section class="paper"><h2>Je gereedschapskist</h2><p>Klap een begrip open voor uitleg en een voorbeeld.</p>${terms.map(t=>`<details><summary>${t[0]}</summary><p>${t[1]}</p><p class="subtle">${t[2]}</p></details>`).join('')}<details><summary>Meer woorden uit de bundel</summary><p><strong>Mythisch:</strong> verbonden met mythen of een legendarische wereld. <strong>Bovennatuurlijk:</strong> buiten de gewone natuurwetten. <strong>Futuristisch:</strong> voorgesteld als behorend tot de toekomst.</p><p><strong>Artificiële intelligentie:</strong> systemen die taken uitvoeren waarvoor we doorgaans menselijke intelligentie nodig hebben. <strong>Kolonisatie:</strong> het vestigen en uitbreiden van een bevolking of macht in een ander gebied. <strong>Vervlechting:</strong> het in elkaar verweven raken van elementen.</p><p><strong>Protagonist:</strong> hoofdpersonage. <strong>Thema:</strong> een centrale kwestie of gedachte in een verhaal. <strong>Tekstbewijs:</strong> een concreet detail waarmee je een interpretatie onderbouwt.</p></details></section><section class="paper"><div class="eyebrow">Oefening 01 · Matching</div><h2>Geef het begrip zijn betekenis</h2><p>Koppel elke omschrijving aan een begrip. Je kunt de keuzelijsten ook met je toetsenbord bedienen.</p>${matching.map(dropdown).join('')}<button class="button" style="margin-top:22px" data-batch="matching">Controleer de koppelingen</button></section><section class="paper"><div class="eyebrow">Oefening 02 · Invullen</div><h2>Woorden in hun wereld</h2><p>Vul de ontbrekende begrippen in. Een begrip kiezen is pas zinvol als de hele zin klopt.</p>${gaps.map(dropdown).join('')}<button class="button" style="margin-top:22px" data-batch="gaps">Controleer de zinnen</button></section><section class="paper">${reflection('woordzin','Gebruik twee begrippen in een eigen uitleg over een genre.','Bijvoorbeeld: de held gaat op een queeste…')}<details><summary>Controleer je eigen zin</summary><p>Gebruik je de woorden in hun juiste betekenis? Vertelt je zin iets over een verhaal of genre? Kun je een concreet voorbeeld toevoegen?</p></details></section>`}
function labPage(){return head(4,'Het genrelaboratorium','Van herkennen naar bewijzen. Onderzoek eerst wat fantasy en sciencefiction delen. Weeg daarna de aanwijzingen in hun context.')+`<div class="callout"><strong>Jouw denkroute:</strong> lees → herken een kenmerk → zoek bewijs → weeg alternatieven af → besluit.</div><div class="section-top"><h2>Het gedeelde gebied</h2><small>Gebaseerd op het venndiagram</small></div><p class="section-intro">Kies de beste plek voor elk beschreven kenmerk. ‘Vooral’ geeft richting; het betekent niet dat overlap onmogelijk is.</p>${sort.map((x,i)=>quiz(x,i)).join('')}<div class="section-top"><h2>Hoe sterk is je bewijs?</h2><small>Meer dan een opvallend woord</small></div>${lab.map((x,i)=>quiz(x,i)).join('')}`}
function readPage(){const r=readings[state.reading];return head(5,'Het leesdossier','Lees, beleef en onderbouw. De fragmenten zijn geselecteerd en ingekort uit de aangeleverde leerkrachtenbundel. […] geeft een weglating aan.')+`<div class="tabs" aria-label="Leesdossiers">${readings.map((r,i)=>`<button class="tab ${state.reading===i?'active':''}" data-reading="${i}" aria-pressed="${state.reading===i}">${i+1}. ${genres[i].name}</button>`).join('')}</div><div class="reading-layout"><article class="paper sticky-read"><div class="eyebrow">Leesdossier 0${state.reading+1}</div><h2>${r.title}</h2><p class="subtle">${r.context}</p><div class="reading">${r.text.map(t=>`<p>${esc(t)}</p>`).join('')}</div><p class="reading-source">${r.author} · <em>${r.book}</em><br>Zoals opgenomen in de leerkrachtenbundel, p. ${r.pages}; selectie voor deze oefening. Bronvermelding volgt de bundel.</p></article><div>${r.qs.map((x,i)=>quiz(x,i)).join('')}<section class="paper"><h3>Jouw lezing telt</h3>${reflection('read'+state.reading,r.reflect)}<details><summary>Zelfcontrole & mogelijke lezing</summary><p>Verwoord ik mijn eigen reactie? Onderbouw ik die met een concreet detail? Leg ik het verband uit?</p><p>${r.model}</p><p class="subtle">Er is niet één juist persoonlijk antwoord. Dit onderdeel wordt niet automatisch beoordeeld.</p></details></section></div></div><div class="panel"><h3>Bespreek het met iemand</h3><p>Vergelijk na het vierde dossier jullie antwoorden: welke vrijheid vinden jullie het belangrijkst? Reageer op elkaars argumenten en verbind de tekst met een voorbeeld uit jullie leefwereld.</p><p class="muted" style="font-size:13px">Optionele duo-opdracht · echte uitwisseling, buiten de automatische score.</p></div>`}
function bordersPage(){return head(6,'Over de grens','Genres zijn geen afgesloten kamers. Onderzoek mengvormen en gevallen waarin je meer informatie nodig hebt.')+borders.map((x,i)=>quiz(x,i)).join('')+`<section class="paper"><div class="eyebrow">Optionele verdieping · Schrijfatelier</div><h2>Dezelfde deur, een andere wereld</h2><p>Begin met: <em>‘Toen ik thuiskwam, stond er iemand op mij te wachten die er onmogelijk kon zijn.’</em> Schrijf twee versies van elk 3–5 zinnen: één als sciencefiction en één als magisch realisme. Verander vooral de verklaring en de omgang met het onmogelijke.</p>${reflection('creative','Jouw twee versies','Sciencefiction: …\n\nMagisch realisme: …')}<details><summary>Waar let je op?</summary><p>In je sciencefictionversie wordt de aanwezigheid als een wetenschappelijke of technologische mogelijkheid voorgesteld. In je magisch-realistische versie verweef je de onmogelijke aanwezigheid met het gewone leven, zonder sluitende rationele verklaring.</p><p>Deze extra opdracht is geïnspireerd op de synopsisopdracht uit de bundel. Je hoeft niets in Teams of BookWidgets in te dienen.</p></details></section>`}
function exitPage(){return head(7,'Het exit ticket','Wat neem jij mee uit de vier werelden? Beantwoord zes nieuwe vragen zonder hints. Je krijgt alle feedback na het indienen.')+`<div class="callout">Controleer je eigen begrip. Je kunt terug naar de atlas, maar probeer eerst wat je zelf weet. Je score is een momentopname en telt alleen deze zes vragen.</div>${exitQs.map((x,i)=>quiz(x,i,true)).join('')}<div id="exitResult">${state.exitSubmitted?resultHTML():`<button class="button" data-action="submitExit">Dien mijn exit ticket in →</button>`}</div><section class="paper"><h2>Even terugkijken</h2>${reflection('exitReflection','Dit onderscheid begrijp ik nu beter. Hierover twijfel ik nog…','Ik begrijp nu…\nIk twijfel nog over…')}<button class="button secondary" data-action="print">Bewaar of print mijn leerpaspoort</button><p class="print-note" style="margin-top:12px">Via het afdrukvenster kun je ook als pdf opslaan. Je antwoorden worden niet naar je leerkracht verstuurd.</p></section>`}
function resultHTML(){const score=exitQs.filter(id=>state.answers[id]===Q[id].correct).length;const wrong=exitQs.filter(id=>state.answers[id]!==Q[id].correct);return `<section class="paper"><div class="eyebrow">Jouw vertrekpunt voor de volgende tekst</div><h2>${score===6?'Je genrekompas staat scherp.':score>=4?'Je ziet de belangrijkste patronen.':'Neem de kern nog eens rustig door.'}</h2><div class="score">${score}<span style="font-size:25px;color:#687576"> / 6</span></div><p>${score===6?'Je hebt alle zes nieuwe situaties juist geïnterpreteerd. Blijf bij langere teksten letten op context en mogelijke overlap.':'Gebruik de toelichtingen bij de vragen om je keuzes te onderzoeken. Hieronder zie je wat je gericht kunt herhalen.'}</p>${wrong.length?`<ul>${wrong.map(id=>`<li><strong>${Q[id].group}:</strong> ${Q[id].explanation}</li>`).join('')}</ul>`:''}<div class="quiz-footer"><button class="button" data-go="${wrong.some(id=>['Overlap','Tekstbewijs'].includes(Q[id].group))?'grenzen':'atlas'}">${score===6?'Bekijk de atlas nog eens':'Gericht herhalen'}</button><button class="button secondary" data-action="retryExit">Exit ticket opnieuw maken</button></div><p class="print-note" style="margin-top:13px">Bij opnieuw maken krijg je dezelfde zes vragen. Een hogere score toont dan ook het effect van de feedback.</p></section>`}
function feedback(id,force=false){const q=Q[id],box=document.getElementById('fb-'+id);if(!box)return;const n=state.tries[id]||0;if(!n&&!force)return;const ok=state.answers[id]===q.correct;box.hidden=false;box.className='feedback '+(ok?'correct':'wrong');box.innerHTML=ok?'<strong>Juist.</strong> '+esc(q.explanation):n<2&&!force?'<strong>Nog niet.</strong> '+esc(q.hint)+' Pas je keuze aan en controleer opnieuw.':'<strong>De best onderbouwde keuze:</strong> '+esc(q.options[q.correct])+'. '+esc(q.explanation)}
function check(id){if(state.answers[id]===undefined){toast('Maak eerst een keuze.');return}state.tries[id]=(state.tries[id]||0)+1;feedback(id);updateDone();save();updateNav()}
function checked(ids){return ids.every(id=>(state.tries[id]||0)>0)}
function updateDone(){state.done.start=checked(intro);state.done.woorden=checked([...matching,...gaps]);state.done.lab=checked([...sort,...lab]);state.done.lezen=checked(readings.flatMap(r=>r.qs))&&readings.every((r,i)=>(state.reflections['read'+i]||'').trim().length>0);state.done.grenzen=checked(borders);state.done.exit=state.exitSubmitted}
function updateNav(){document.getElementById('nav').innerHTML=routes.map(([id,label],i)=>`<button class="nav-item ${current===id?'active':''} ${state.done[id]?'done':''}" data-go="${id}" ${current===id?'aria-current="step"':''}><span class="nav-num">${state.done[id]?'✓':String(i+1).padStart(2,'0')}</span><span>${label}</span></button>`).join('');const n=routes.filter(x=>state.done[x[0]]).length;document.getElementById('progressText').textContent=`Je ontdekkingstocht · ${n}/7`;document.getElementById('progressBar').style.width=n/7*100+'%'}
function render(focus=false){updateDone();updateNav();document.getElementById('main').innerHTML=({start:startPage,atlas:atlasPage,woorden:wordsPage,lab:labPage,lezen:readPage,grenzen:bordersPage,exit:exitPage})[current]()+footer();Object.keys(Q).forEach(id=>{if(id.startsWith('e')){if(state.exitSubmitted)feedback(id,true)}else feedback(id)});if(focus){window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true})}}
function go(id){if(!routes.some(x=>x[0]===id))return;if(location.hash==='#'+id){current=id;render(true)}else location.hash=id}
function modal(html){modalReturn=document.activeElement;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').hidden=false;document.body.style.overflow='hidden';document.querySelector('#modal button').focus()}
function closeModal(){document.getElementById('modal').hidden=true;document.body.style.overflow='';modalReturn?.focus()}
function teacher(){modal(`<div class="modal-head"><div><div class="eyebrow">Didactische verantwoording</div><h2 id="modalTitle">Voor de leerkracht</h2></div><button class="close" data-action="close" aria-label="Sluiten">×</button></div><p>Voor de derde graad D/A-finaliteit. Reken op ongeveer twee lesuren: start en atlas 20 min, woordenschat 15 min, laboratorium 15 min, leesdossiers 30 min, grenzen 10 min en exit ticket 10 min. Pas het tempo aan je klas aan.</p><h3>Leerplandoelen in de praktijk</h3><p class="subtle">III-Ned-da · D/2024/13.758/276 · versie juni 2024. Onderstaande formuleringen zijn verkort; deze app draagt bij aan de doelen en dekt ze niet volledig.</p><div class="table-scroll"><table><thead><tr><th>Doel</th><th>Leeractiviteit en bewijs</th></tr></thead><tbody><tr><td>LPD 1 · onderwerp, hoofdgedachte en hoofdpunten bepalen</td><td>Kern en hoofdconflict bepalen in de leesdossiers.</td></tr><tr><td>LPD 2 · relevante informatie selecteren</td><td>Genrekeuzes en interpretaties koppelen aan concrete tekstgegevens.</td></tr><tr><td>LPD 8 · eigen beleving en interpretatie verwoorden</td><td>Open leesreactie bij elk dossier. Persoonlijke beleving wordt met details onderbouwd; alleen genrevragen zouden dit doel niet voldoende ondersteunen.</td></tr><tr><td>LPD 13 · verworven woordenschat inzetten</td><td>Matching, invullen en begrippen inzetten in een eigen toelichting.</td></tr><tr><td>LPD 14 · doelgericht strategieën inzetten</td><td>Voorkennis activeren, gericht herlezen, aanwijzingen vergelijken en eigen antwoorden bijsturen.</td></tr><tr><td>LPD 6 en 9 · interactie en relevantie van literatuur</td><td>Alleen bij uitvoering van de duo-opdracht. Leerlingen reageren op elkaar over vrijheid, controle en hun leefwereld. Het aspect ontstaanscontext vraagt verdere lesuitwerking.</td></tr><tr><td>LPD 4 en 5 · doelgericht schrijven en creatieve taalexpressie</td><td>Optionele schrijfopdracht: dezelfde beginsituatie in twee genres uitwerken. Voor verdere evaluatie bespreek je tekstdoel, lezer en kwaliteit.</td></tr></tbody></table></div><h3 style="margin-top:25px">Feedback en voortgang</h3><p>Gesloten oefenvragen geven na een eerste fout een hint en na een tweede controle de uitleg. De voortgangsvinkjes betekenen ‘doorlopen’, niet ‘beheerst’. Het leesdossier telt als doorlopen zodra alle vragen gecontroleerd zijn en alle vier leesreacties zijn ingevuld. Open antwoorden worden niet automatisch beoordeeld. Alleen het exit ticket krijgt een afzonderlijke score op zes.</p><p>Leerlingen kunnen hun leerpaspoort afdrukken of als pdf bewaren. Er is geen centraal dashboard. Lokale voortgang is gebonden aan dit bestand en deze browser; gebruik op een gedeeld toestel ‘Opnieuw beginnen’ na het bewaren van het resultaat.</p><h3>Bronnen en bewerking</h3><ul><li><em>Hoofdstuk 2 – Fantasy, sciencefiction, magisch realisme & dystopische verhalen – Leerkrachten</em>, aangeleverd lesmateriaal, 21 pagina’s. Theorie en oefenvormen op p. 2–18; creatieve opdracht geïnspireerd op p. 9.</li><li><em>III-Ned-da</em>, Katholiek Onderwijs Vlaanderen, juni 2024, p. 13–17 en 20–22.</li><li>Literaire fragmenten: geselecteerd uit de bundel, inclusief de daar gebruikte tekstversie en bronvermelding; weglatingen zijn zichtbaar gemaakt. Controle tegen oorspronkelijke boekedities is niet uitgevoerd.</li><li>Nieuwe microfragmenten, oefenvragen en illustraties zijn voor deze app gemaakt.</li><li>Aanvullende genreverdieping: <a href="https://sf-encyclopedia.com/entry/dystopias" target="_blank" rel="noopener">The Encyclopedia of Science Fiction: Dystopias</a> en <a href="https://sf-encyclopedia.com/entry/post-holocaust" target="_blank" rel="noopener">Post-Holocaust</a>.</li></ul><p class="subtle">De kernroute werkt offline. Alleen deze externe bronlinks vragen internet. Trailers en externe BookWidgets zijn niet nodig voor de oefeningen.</p><button class="button" data-action="close">Terug naar de atlas</button>`)}
function printPassport(){const score=exitQs.filter(id=>state.answers[id]===Q[id].correct).length;document.getElementById('printArea').innerHTML=`<h1>Tussen werelden</h1><p>Mijn leerpaspoort · Naam: __________________ · Klas: __________</p><p>Doorlopen onderdelen: ${routes.filter(x=>state.done[x[0]]).length}/7. Een vinkje betekent doorlopen, niet noodzakelijk beheerst.</p><h2>Exit ticket</h2><p>${state.exitSubmitted?'Score: '+score+'/6':'Nog niet ingediend.'}</p>${state.exitSubmitted?exitQs.map((id,i)=>`<section><p><strong>${i+1}. ${esc(Q[id].prompt)}</strong><br>Mijn keuze: ${esc(Q[id].options[state.answers[id]])}<br>${state.answers[id]===Q[id].correct?'Juist.':'Nog te herhalen.'} ${esc(Q[id].explanation)}</p></section>`).join(''):''}<h2>Mijn leesreacties</h2>${readings.map((r,i)=>`<section><h3>${esc(r.book)}</h3><p>${esc(r.reflect)}</p><p>${esc(state.reflections['read'+i]||'Nog niet ingevuld.')}</p></section>`).join('')}<h2>Mijn woordenschat</h2><p>${esc(state.reflections.woordzin||'Nog niet ingevuld.')}</p>${state.reflections.creative?'<h2>Mijn twee verhaalversies</h2><p>'+esc(state.reflections.creative)+'</p>':''}<h2>Mijn reflectie</h2><p>${esc(state.reflections.exitReflection||'Nog niet ingevuld.')}</p>`;window.print()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.world!==undefined){state.atlas=+b.dataset.world;save();go('atlas')}if(b.dataset.atlas!==undefined){state.atlas=+b.dataset.atlas;save();render();document.querySelector(`[data-atlas="${state.atlas}"]`).focus()}if(b.dataset.reading!==undefined){state.reading=+b.dataset.reading;save();render();document.querySelector(`[data-reading="${state.reading}"]`).focus()}if(b.dataset.check)check(b.dataset.check);if(b.dataset.batch){const ids=b.dataset.batch==='matching'?matching:gaps;let missing=0;ids.forEach(id=>{if(state.answers[id]===undefined)missing++;else check(id)});toast(missing?`Nog ${missing} ${missing===1?'antwoord':'antwoorden'} invullen.`:'Bekijk de feedback bij je antwoorden.')}switch(b.dataset.action){case'atlasDone':state.done.atlas=true;save();updateNav();toast('De atlas is als doorlopen gemarkeerd.');break;case'submitExit':if(!exitQs.every(id=>state.answers[id]!==undefined)){toast('Beantwoord eerst alle zes vragen.');document.getElementById('q-'+exitQs.find(id=>state.answers[id]===undefined)).scrollIntoView({block:'center'});break}state.exitSubmitted=true;exitQs.forEach(id=>state.tries[id]=2);save();render();document.getElementById('exitResult').scrollIntoView({block:'start'});break;case'retryExit':state.exitSubmitted=false;exitQs.forEach(id=>{delete state.answers[id];delete state.tries[id]});save();render(true);break;case'print':printPassport();break;case'close':closeModal();break;case'reset':modal(`<div class="modal-head"><h2 id="modalTitle">Een nieuwe ontdekkingstocht?</h2><button class="close" data-action="close" aria-label="Sluiten">×</button></div><p>Hiermee wis je alle antwoorden, leesreacties en voortgang in deze browser. Bewaar eerst je leerpaspoort als je die wilt houden.</p><div class="quiz-footer"><button class="button" data-action="confirmReset">Wis mijn voortgang</button><button class="button secondary" style="color:#20313a" data-action="close">Annuleren</button></div>`);break;case'confirmReset':state={answers:{},tries:{},reflections:{},done:{},exitSubmitted:false,atlas:0,reading:0};save();closeModal();go('start');break}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('input[type=radio]')){if(el.name.startsWith('e')&&state.exitSubmitted)return;state.answers[el.name]=+el.value;const fb=document.getElementById('fb-'+el.name);if(fb)fb.hidden=true;save()}if(el.matches('select[data-answer]')){const id=el.dataset.answer;if(el.value==='')delete state.answers[id];else state.answers[id]=+el.value;document.getElementById('fb-'+id).hidden=true;save()}});
document.addEventListener('input',e=>{const id=e.target.dataset.reflection;if(id){state.reflections[id]=e.target.value;updateDone();save();updateNav();document.getElementById('saved-'+id).textContent=storageOK?'Antwoord bewaard in deze browser.':'Antwoord bewaard tijdens deze sessie.'}});
document.getElementById('teacherBtn').addEventListener('click',teacher);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(document.getElementById('modal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const items=[...document.querySelectorAll('#modal button,#modal a')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{current=routes.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'start';render(true)});
current=routes.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'start';render();
</script>
